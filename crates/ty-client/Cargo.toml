[package]
name = "ty-client"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
ty-types = { path = "../ty-types" }
ty-merge = { path = "../ty-merge" }
