[package]
name = "ty-store"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ty-types = { path = "../ty-types" }

[dev-dependencies]
tempfile = "3"
