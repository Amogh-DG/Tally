[package]
name = "ty-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
gethostname = "1.1"
ty-types = { path = "../ty-types" }
ty-merge = { path = "../ty-merge" }
ty-settings = { path = "../ty-settings" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "ty-server"
path = "src/main.rs"
