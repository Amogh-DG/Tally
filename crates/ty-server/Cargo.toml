[package]
name = "ty-server"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ty-types = { path = "../ty-types" }
ty-merge = { path = "../ty-merge" }
ty-settings = { path = "../ty-settings" }

[[bin]]
name = "ty-server"
path = "src/main.rs"
